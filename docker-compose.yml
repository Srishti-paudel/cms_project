services:
  app: 
    build: .
    ports:
       - "3005:3005"
    environment:
        DB_HOST=db
        DB_USER= ${DB_USER}
        DB_PASSWORD=${DB_PASSWORD}
        DB_NAME=${DB_NAME}
        DB_DIALECT=${DB_DIALECT}
        PORT: ${PORT}
    depends_on:
          - db
  db:
     image: mysql:8.0
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        MYSQL_DATABASE: ${DB_NAME}
        MYSQL_USER: ${DB_USER}
        MYSQL_PASSWORD: ${DB_PASSWORD}
      volumes:
      -db_data:/var/lib/mysql
  volumes:
    db_data:                 
